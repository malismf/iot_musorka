# BinSense — весь сервер одной командой:  docker compose up -d --build
#
# Перед первым запуском:  ./infra/scripts/init-env.sh  (создаст .env с паролями)
name: binsense

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: binsense
      POSTGRES_USER: binsense
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?задайте POSTGRES_PASSWORD в .env}
      GRAFANA_DB_PASSWORD: ${GRAFANA_DB_PASSWORD:-grafana}
      TZ: ${TZ:-Europe/Moscow}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./infra/db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U binsense -d binsense"]
      interval: 10s
      timeout: 5s
      retries: 12

  mqtt:
    image: eclipse-mosquitto:2
    restart: unless-stopped
    entrypoint: ["/bin/sh", "/entrypoint.sh"]
    environment:
      MQTT_ADMIN_USER: ${MQTT_ADMIN_USER:-binsense-admin}
      MQTT_ADMIN_PASSWORD: ${MQTT_ADMIN_PASSWORD:?задайте MQTT_ADMIN_PASSWORD в .env}
    ports:
      - "1883:1883"          # устройства подключаются сюда
    volumes:
      - ./infra/mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - ./infra/mosquitto/entrypoint.sh:/entrypoint.sh:ro
      - mosquitto_data:/mosquitto/data

  api:
    build: ./backend
    image: binsense/backend:local
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql://binsense:${POSTGRES_PASSWORD}@db:5432/binsense
      MQTT_HOST: mqtt
      MQTT_PORT: 1883
      TZ: ${TZ:-Europe/Moscow}
    depends_on:
      db:
        condition: service_healthy
      mqtt:
        condition: service_started

  ingestor:
    build: ./backend
    image: binsense/backend:local
    restart: unless-stopped
    command: ["python", "-m", "app.ingestor"]
    env_file: .env
    environment:
      DATABASE_URL: postgresql://binsense:${POSTGRES_PASSWORD}@db:5432/binsense
      MQTT_HOST: mqtt
      MQTT_PORT: 1883
      TZ: ${TZ:-Europe/Moscow}
    depends_on:
      db:
        condition: service_healthy
      mqtt:
        condition: service_started

  bot:
    build: ./backend
    image: binsense/backend:local
    restart: unless-stopped
    command: ["python", "-m", "app.bot"]
    env_file: .env
    environment:
      DATABASE_URL: postgresql://binsense:${POSTGRES_PASSWORD}@db:5432/binsense
      MQTT_HOST: mqtt
      MQTT_PORT: 1883
      TZ: ${TZ:-Europe/Moscow}
    depends_on:
      db:
        condition: service_healthy

  web:
    build: ./frontend
    image: binsense/web:local
    restart: unless-stopped
    environment:
      DOMAIN: ${DOMAIN:-localhost}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"        # HTTP/3
    volumes:
      - ./infra/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - api

  grafana:
    image: grafana/grafana:11.3.0
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_SERVER_ROOT_URL: ${PUBLIC_URL:-http://localhost}/grafana/
      GF_SERVER_SERVE_FROM_SUB_PATH: "true"
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      BINSENSE_DB_PASSWORD: ${GRAFANA_DB_PASSWORD:-grafana}
      TZ: ${TZ:-Europe/Moscow}
    volumes:
      - ./infra/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./infra/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    depends_on:
      db:
        condition: service_healthy

  # Эмулятор устройств — для разработки и демонстрации:
  #   docker compose --profile demo up -d emulator
  emulator:
    build: ./backend
    image: binsense/backend:local
    profiles: ["demo"]
    restart: unless-stopped
    command:
      [
        "python", "/tools/emulator.py",
        "--api", "http://api:8000",
        "--mqtt-host", "mqtt",
        "--count", "12",
        "--speed", "120",
        "--state", "/tmp/emulator_state.json",
      ]
    environment:
      BINSENSE_EMAIL: ${ADMIN_EMAIL}
      BINSENSE_PASSWORD: ${ADMIN_PASSWORD}
      TZ: ${TZ:-Europe/Moscow}
    volumes:
      - ./tools:/tools:ro
    depends_on:
      - api
      - mqtt

volumes:
  pgdata:
  mosquitto_data:
  caddy_data:
  caddy_config:
  grafana_data:
