# Mosquitto для BinSense.
#
# Доступ выдаётся плагином dynamic-security: сервер создаёт для каждого
# устройства отдельного клиента и роль, которая разрешает писать только
# в свои топики bins/<id>/telemetry и bins/<id>/event и читать bins/<id>/config.

per_listener_settings false

listener 1883
protocol mqtt
allow_anonymous false

# Управление доступом: файл создаётся entrypoint.sh при первом запуске
plugin /usr/lib/mosquitto_dynamic_security.so
plugin_opt_config_file /mosquitto/data/dynamic-security.json

# Хранение сессий и retained-сообщений (настройки устройств живут именно в них)
persistence true
persistence_location /mosquitto/data/
autosave_interval 60

max_keepalive 300
max_queued_messages 2000
message_size_limit 8192

log_dest stdout
log_type error
log_type warning
log_type notice
log_type information
connection_messages true

# --- TLS (необязательно) -----------------------------------------------------
# Для боевого развёртывания добавьте второй порт с сертификатом; см. docs/DEPLOY.md.
# listener 8883
# protocol mqtt
# certfile /mosquitto/certs/fullchain.pem
# keyfile  /mosquitto/certs/privkey.pem
