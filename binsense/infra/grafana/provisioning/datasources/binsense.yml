apiVersion: 1

datasources:
  - name: BinSense PostgreSQL
    uid: binsense-pg
    type: grafana-postgresql-datasource
    access: proxy
    url: db:5432
    user: grafana_ro
    isDefault: true
    jsonData:
      database: binsense
      sslmode: disable
      postgresVersion: 1600
      timescaledb: false
      maxOpenConns: 5
      maxIdleConns: 2
    secureJsonData:
      password: ${BINSENSE_DB_PASSWORD}
    editable: false
