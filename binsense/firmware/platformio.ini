; BinSense — прошивка датчика заполненности контейнера.
;
;   pio run -e esp8266                 собрать
;   pio run -e esp8266 -t upload       залить
;   pio device monitor                 консоль (115200)
;
; Плата — ESP8266 NodeMCU v2/v3 или Wemos D1 mini (один и тот же чип ESP-12,
; прошивка общая), питание от USB. Окружение выбирается по датчику.

[platformio]
default_envs = esp8266
src_dir = src
include_dir = include

[env]
platform = espressif8266@4.2.1
framework = arduino
board = nodemcuv2
monitor_speed = 115200
monitor_filters = esp8266_exception_decoder, time
upload_speed = 460800
lib_deps =
    tzapu/WiFiManager@^2.0.17
    256dpi/MQTT@^2.5.2
build_flags =
    -Wall

; --- Основной вариант: влагозащищённый датчик A02YYUW по UART
[env:esp8266]
build_flags =
    ${env.build_flags}
    -DHW_NAME=\"esp8266-a02yyuw\"
    -DSENSOR_MIN_MM=30
    -DSENSOR_MAX_MM=4500

; --- HC-SR04 (Trig/Echo), питание датчика 5 В, Echo через делитель
[env:esp8266_hcsr04]
build_flags =
    ${env.build_flags}
    -DHW_NAME=\"esp8266-hcsr04\"
    -DSENSOR_PULSE
    -DSENSOR_MIN_MM=25
    -DSENSOR_MAX_MM=4000

; --- JSN-SR04T v3 в режиме UART (мёртвая зона больше, порог 100 % дальше)
[env:esp8266_jsn]
build_flags =
    ${env.build_flags}
    -DHW_NAME=\"esp8266-jsn\"
    -DSENSOR_MIN_MM=250
    -DSENSOR_MAX_MM=6000
    -DDEFAULT_FULL_MM=300
